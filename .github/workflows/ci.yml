# Checks every pull request (RFC-002 R-13, RFC-004 R-6): unit tests, lint and a release build,
# against the published yorisoi platform (read with GITHUB_TOKEN: the platform's packages give this
# repository Actions access).
# The release APK is unsigned here (no keystore.properties); it only has to build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build
        run: ./gradlew test lint assembleRelease --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/prompt-golden.txt
